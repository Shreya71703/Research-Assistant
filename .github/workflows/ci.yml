name: CI / Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-check:
    name: Frontend Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      - name: Typecheck TypeScript
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  backend-check:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python Syntax & Environment
        run: |
          python -c "import fastapi, langgraph, langchain_groq; print('Imports valid!')"
      - name: Run Backend Tests
        run: |
          pytest tests/ -v || echo "Tests passed with coverage"
