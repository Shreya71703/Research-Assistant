name: CI / Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-check:
    name: Frontend Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install
      - name: Typecheck TypeScript
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  backend-check:
    name: Backend Quality & Syntax Checks
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: "gsk_dummy_ci_test_key_123"
      ENVIRONMENT: "testing"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python Environment & Syntax
        run: |
          python -c "import fastapi, langgraph; print('FastAPI and LangGraph imported successfully!')"
      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v || true
